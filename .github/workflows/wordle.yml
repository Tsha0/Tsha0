name: Wordle

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: wordle
  cancel-in-progress: false

jobs:
  guess:
    if: startsWith(github.event.issue.title, 'wordle|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Score guess
        id: guess
        env:
          TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set +e
          MSG=$(python3 wordle/guess.py "$TITLE" "$AUTHOR")
          echo "ok=$([ $? -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "msg<<MSG_EOF"
            echo "$MSG"
            echo "MSG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit board
        if: steps.guess.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordle/state.json wordle/board.svg README.md
          git commit -m "wordle: guess by @${{ github.event.issue.user.login }}"
          git pull --rebase origin main
          git push

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.guess.outputs.msg }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "$MSG"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
