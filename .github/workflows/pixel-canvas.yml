name: Pixel canvas

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: pixel-canvas
  cancel-in-progress: false

jobs:
  place:
    if: startsWith(github.event.issue.title, 'place|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Place pixel
        id: place
        env:
          TITLE: ${{ github.event.issue.title }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          set +e
          MSG=$(python3 canvas/place.py "$TITLE" "$AUTHOR")
          echo "ok=$([ $? -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "msg=$MSG" >> "$GITHUB_OUTPUT"

      - name: Commit canvas
        if: steps.place.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canvas/state.json canvas/canvas.svg README.md
          git commit -m "canvas: ${{ github.event.issue.title }} by @${{ github.event.issue.user.login }}"
          git pull --rebase origin main
          git push

      - name: Reply and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "${{ steps.place.outputs.msg }}"
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
